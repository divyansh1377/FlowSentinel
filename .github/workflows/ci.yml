name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: black --check team2-backend team3-ml-simulation
      - run: flake8 team2-backend team3-ml-simulation
      - run: ML_N_JOBS=1 python team3-ml-simulation/train_models.py
      - run: pytest team2-backend/test_backend.py -v
