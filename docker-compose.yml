version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: team2-backend/Dockerfile
    container_name: flowsentinel-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - STREAM_INTERVAL_MS=400
      - ALERT_DEBOUNCE_SECONDS=3.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

